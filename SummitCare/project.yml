# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate the project with:
#   xcodegen generate
# then open SummitCare.xcodeproj. Set DEVELOPMENT_TEAM to your own team ID.
name: SummitCare
options:
  bundleIdPrefix: com.summitcare
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ABCDE12345          # placeholder; matches apple-app-site-association
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SummitCare:
    type: application
    platform: iOS
    sources:
      - path: SummitCare
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summitcare.app
        INFOPLIST_FILE: SummitCare/Info.plist
        CODE_SIGN_ENTITLEMENTS: SummitCare/SummitCare.entitlements
        DEVELOPMENT_ASSET_PATHS: "\"SummitCare/Preview Content\""
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SummitCareNotificationService
        embed: true
  SummitCareNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: SummitCareNotificationService
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: SummitCare/Security/TokenStore.swift   # compiled into both targets (Solution 24)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summitcare.app.NotificationService
        INFOPLIST_FILE: SummitCareNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: SummitCareNotificationService/SummitCareNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  SummitCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SummitCareTests
    dependencies:
      - target: SummitCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summitcare.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SummitCare:
    build:
      targets:
        SummitCare: all
        SummitCareNotificationService: all
    test:
      targets:
        - SummitCareTests
