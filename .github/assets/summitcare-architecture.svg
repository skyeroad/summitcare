<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Inter, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212738"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
  </defs>
  <style>
    .t{font-size:12px;fill:#212738;font-weight:600}
    .s{font-size:10.5px;fill:#4A5266}
    .phi{fill:#FFF1DB;stroke:#FF9A00;stroke-width:1.6}
    .box{fill:#F2F2F2;stroke:#8C93A3;stroke-width:1.2}
    .ext{fill:#FFFFFF;stroke:#8C93A3;stroke-width:1.2}
    .w{stroke:#212738;stroke-width:1.6;fill:none}
    .n{stroke:#7A7A7A;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    .lbl{font-size:10px;fill:#4A5266;font-style:italic}
  </style>

  <!-- AWS boundary -->
  <rect x="178" y="14" width="390" height="440" rx="10" fill="none" stroke="#4A5266" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="192" y="34" class="t" style="fill:#4A5266">AWS account, covered by the AWS BAA</text>

  <!-- Clients -->
  <rect x="10" y="70" width="150" height="120" rx="8" class="phi"/>
  <text x="85" y="94" text-anchor="middle" class="t">Patient's iPhone</text>
  <text x="85" y="114" text-anchor="middle" class="s">SummitCare iOS app</text>
  <text x="85" y="132" text-anchor="middle" class="s">Keychain tokens</text>
  <text x="85" y="150" text-anchor="middle" class="s">Protected files, no backup</text>
  <text x="85" y="168" text-anchor="middle" class="s">Solutions 2, 11, 12</text>

  <rect x="10" y="235" width="150" height="70" rx="8" class="ext"/>
  <text x="85" y="260" text-anchor="middle" class="t">Staff browser</text>
  <text x="85" y="279" text-anchor="middle" class="s">Clinic web console</text>
  <text x="85" y="296" text-anchor="middle" class="s">Solutions 1, 4, 5</text>

  <!-- Load balancer -->
  <rect x="196" y="150" width="104" height="66" rx="8" class="box"/>
  <text x="248" y="176" text-anchor="middle" class="t">Load balancer</text>
  <text x="248" y="194" text-anchor="middle" class="s">TLS 1.2 or later</text>
  <text x="248" y="208" text-anchor="middle" class="s">Solution 10</text>

  <!-- App servers -->
  <rect x="330" y="106" width="124" height="150" rx="8" class="box"/>
  <text x="392" y="130" text-anchor="middle" class="t">Rails API servers</text>
  <text x="392" y="150" text-anchor="middle" class="s">Auth, policies,</text>
  <text x="392" y="164" text-anchor="middle" class="s">serializers, audit</text>
  <text x="392" y="186" text-anchor="middle" class="t">Solid Queue jobs</text>
  <text x="392" y="206" text-anchor="middle" class="s">PHI only in memory</text>
  <text x="392" y="224" text-anchor="middle" class="s">Private subnet</text>
  <text x="392" y="242" text-anchor="middle" class="s">Solutions 3, 4, 13, 34</text>

  <!-- KMS -->
  <rect x="474" y="40" width="84" height="50" rx="8" class="box"/>
  <text x="516" y="61" text-anchor="middle" class="t">AWS KMS</text>
  <text x="516" y="78" text-anchor="middle" class="s">3 keys</text>

  <!-- Data stores -->
  <rect x="190" y="300" width="118" height="64" rx="8" class="phi"/>
  <text x="249" y="324" text-anchor="middle" class="t">S3 documents</text>
  <text x="249" y="341" text-anchor="middle" class="s">Private, SSE-KMS</text>
  <text x="249" y="356" text-anchor="middle" class="s">Solution 9</text>

  <rect x="330" y="300" width="124" height="64" rx="8" class="phi"/>
  <text x="392" y="324" text-anchor="middle" class="t">RDS PostgreSQL</text>
  <text x="392" y="341" text-anchor="middle" class="s">Encrypted columns</text>
  <text x="392" y="356" text-anchor="middle" class="s">Solutions 7, 8</text>

  <rect x="474" y="300" width="88" height="64" rx="8" class="box"/>
  <text x="518" y="322" text-anchor="middle" class="t">Audit archive</text>
  <text x="518" y="339" text-anchor="middle" class="s">S3 Object Lock</text>
  <text x="518" y="355" text-anchor="middle" class="s">IDs only, 13, 14</text>

  <rect x="330" y="386" width="124" height="58" rx="8" class="phi"/>
  <text x="392" y="408" text-anchor="middle" class="t">Encrypted backups</text>
  <text x="392" y="424" text-anchor="middle" class="s">Copied to 2nd region</text>
  <text x="392" y="438" text-anchor="middle" class="s">Solution 28</text>

  <!-- External services -->
  <rect x="590" y="56" width="120" height="44" rx="8" class="ext"/>
  <text x="650" y="75" text-anchor="middle" class="t">Email (SES)</text>
  <text x="650" y="91" text-anchor="middle" class="s">Generic text only</text>
  <rect x="590" y="112" width="120" height="44" rx="8" class="ext"/>
  <text x="650" y="131" text-anchor="middle" class="t">SMS provider</text>
  <text x="650" y="147" text-anchor="middle" class="s">BAA, generic text</text>
  <rect x="590" y="168" width="120" height="44" rx="8" class="ext"/>
  <text x="650" y="187" text-anchor="middle" class="t">Apple Push (APNs)</text>
  <text x="650" y="203" text-anchor="middle" class="s">No PHI in payload</text>
  <rect x="590" y="240" width="120" height="50" rx="8" class="ext"/>
  <text x="650" y="260" text-anchor="middle" class="t">AI model endpoint</text>
  <text x="650" y="277" text-anchor="middle" class="s">BAA, redacted input</text>

  <!-- Arrows: PHI in transit -->
  <path d="M160,140 L194,175" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M160,268 L194,205" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M300,183 L328,183" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M392,256 L392,298" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M360,256 L285,298" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M392,364 L392,384" class="w" marker-end="url(#a)"/>
  <path d="M454,236 L588,262" class="w" marker-end="url(#a)" marker-start="url(#a)"/>
  <!-- Arrows: no PHI -->
  <path d="M454,118 L476,92" class="n" marker-end="url(#g)"/>
  <path d="M454,248 L500,298" class="n" marker-end="url(#g)"/>
  <path d="M454,150 L588,86" class="n" marker-end="url(#g)"/>
  <path d="M454,155 L588,134" class="n" marker-end="url(#g)"/>
  <path d="M454,170 L588,190" class="n" marker-end="url(#g)"/>

  <!-- Legend -->
  <rect x="10" y="350" width="160" height="104" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="22" y="370" class="t">Legend</text>
  <path d="M22,388 L62,388" class="w" marker-end="url(#a)"/>
  <text x="70" y="392" class="s">PHI in transit (TLS)</text>
  <path d="M22,408 L62,408" class="n" marker-end="url(#g)"/>
  <text x="70" y="412" class="s">No PHI, or keys</text>
  <rect x="22" y="422" width="40" height="18" rx="4" class="phi"/>
  <text x="70" y="435" class="s">PHI at rest</text>
</svg>
