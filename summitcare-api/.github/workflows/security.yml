name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches advisories published after merge

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: |
          mkdir -p tmp
          bin/brakeman --no-pager -o tmp/brakeman.json -o tmp/brakeman.txt || { cat tmp/brakeman.txt; exit 1; }
      - name: bundler-audit
        run: bundle exec bundler-audit check --update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: tmp/brakeman.*

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
